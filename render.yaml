services:
  - type: web
    name: smartstock-os
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Requires manual entry in Render Dashboard
      - key: JWT_SECRET
        sync: false # Requires manual entry in Render Dashboard
